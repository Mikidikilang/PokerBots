mlops:
    value:
        async_upload:
            commit_message_prefix: auto-checkpoint
            enabled: true
            sync_interval_minutes: 15
        checkpoint:
            buffer_save_interval_iterations: 500
            local_checkpoint_dir: checkpoints/
            max_checkpoints_to_keep: 5
