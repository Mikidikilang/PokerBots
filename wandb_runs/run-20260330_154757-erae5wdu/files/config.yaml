            components:
                - python_stdlib
                - numpy
                - torch_cpu
                - torch_cuda
                - dataloader
            save_rng_states: true
        wandb:
            entity: soross
            project: poker-mccfr-v5
model:
    value:
        actor:
            activation: relu
            dropout: 0.1
            hidden_layers:
                - 512
                - 256
                - 128
            output_activation: softmax
        architecture: mlp_actor_critic
        critic:
            activation: relu
            dropout: 0.1
            hidden_layers:
                - 512
                - 256
                - 128
            output_dim: 1
        embedding:
            card_embed_dim: 64
            context_embed_dim: 32
            history_embed_dim: 64
        weight_init: orthogonal
        weight_init_gain: 1
orchestrator:
    value:
        mab:
            algorithm: ucb
            max_pool_size: 20
            pool_snapshot_interval: 50
            ucb_exploration_factor: 2
        phases:
            phase_0:
                description: Alapvető póker mechanikák és matematika elsajátítása statikus botok ellen
                name: Rules-Based Exploitation
                opponents:
                    - calling_station
                    - maniac
                    - random
                    - tight_passive
                transition_threshold:
                    min_hands: 100000
                    min_vpip_in_range: true
                    min_win_rate_mbb: 50
            phase_1:
                description: Finomhangolt emberi adatokon tréningelt ellenfelek elleni játék
                name: Opponent Modeling & SFT
                opponents:
                    - sft_aggressive
                    - sft_balanced
                    - sft_passive
                    - phase_0_snapshots
                transition_threshold:
                    max_exploitability_pct: 1
                    min_hands: 200000
                    min_win_rate_mbb: 30
            phase_2:
                description: Multi-Armed Bandit vezérelt önjáték és Nash-konvergencia
                name: Co-Adaptive FSP
                opponents:
                    - self_play_pool
                    - benchmark_bots
                target_metrics:
                    min_slumbot_mbb: 50
                    nash_distance_pct: 0.3
        telemetry:
            eval_interval_iterations: 50
            log_interval_iterations: 10
            sliding_window_hands: 100000
