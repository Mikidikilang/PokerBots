# ==============================================================================
# VR-DeepPDCFR+ — Production Config  (6-Max No-Limit Texas Hold'em)
# ==============================================================================
# Optimised for Kaggle P100/T4 (16 GB VRAM, 13 h session).
# All monetary values in big blinds (BB) unless stated otherwise.

project:
  name: "vr-deep-pdcfr-plus-6max"
  version: "1.0.0"
  description: "6-Max NLHE agent via VR-DeepPDCFR+"

# ------------------------------------------------------------------------------
# Environment
# ------------------------------------------------------------------------------
environment:
  game_type: "no-limit-holdem"
  num_players: 6
  big_blind: 2.0
  small_blind: 1.0
  initial_stack_bb: 100.0          # 100 BB effective stacks

  # Action space  (12 discrete buckets — check / call separated)
  action_space:
    num_actions: 12
    bet_sizes:
      preflop: [0.33, 0.5, 0.75, 1.0]
      flop:    [0.33, 0.5, 0.75, 1.0]
      turn:    [0.5,  0.75, 1.0, 1.5]
      river:   [0.5,  0.75, 1.0, 1.5]

  # Observation space
  observation_space:
    max_betting_actions: 18
    action_feature_dim: 13          # hero indicator + street + bet ratio + SPR
    use_extended_history: true
    use_bet_encoding: true
    use_suit_isomorphism: true
    use_equity_bucketing: true
    num_equity_buckets: 100

# ------------------------------------------------------------------------------
# Neural Networks  (4 networks per player × 6 players)
# ------------------------------------------------------------------------------
networks:
  shared_architecture:             # All four nets share this base
    hidden_dims: [1024, 1024, 512, 256]
    activation: "relu"
    use_layer_norm: true
    dropout_p: 0.0

  cumulative_advantage:            # θ  – persistent, bootstrapped
    learning_rate: 3.0e-4
    adam_epsilon: 1.0e-5
    max_grad_norm: 1.0

  instantaneous_advantage:         # φ  – ephemeral, single iteration
    learning_rate: 3.0e-4
    adam_epsilon: 1.0e-5
    max_grad_norm: 1.0

  value_baseline:                  # Q  – state value for variance reduction
    learning_rate: 3.0e-4
    adam_epsilon: 1.0e-5
    max_grad_norm: 1.0

  average_strategy:                # Π  – Nash-converging average strategy
    learning_rate: 1.0e-3
    adam_epsilon: 1.0e-5
    max_grad_norm: 1.0

# ------------------------------------------------------------------------------
# CFR / VR-DeepPDCFR+  training hyperparameters
# ------------------------------------------------------------------------------
cfr:
  training_algorithm: "cfr"        # Only "cfr" is supported

  # Traversal
  num_iterations: 50000
  traversals_per_iteration: 1500   # External-sampling traversals per (p0+p1)
  max_tree_depth: 60               # Poker-theoretic max (4 streets × ~15 raises)

  # Temporal discounting (Brown & Sandholm 2019)  α=1.5, β=0, γ=2
  dcfr_alpha: 1.5
  dcfr_beta:  0.0
  dcfr_gamma: 2.0

  # Variance-reduction knobs
  regret_discount: 1.0             # Set < 1 to discount old regrets (LCFR)
  regret_min_threshold: 0.0        # Clamp below this → 0 (CFR+)
  regret_scaling: 1.0

  # Network training (per CFR iteration)
  num_network_epochs: 4
  batch_size: 4096

  # Convergence monitoring
  track_exploitability: true
  exploitability_update_freq: 250  # Measure every N CFR iterations

# ------------------------------------------------------------------------------
# Replay Buffers
# ------------------------------------------------------------------------------
buffers:
  advantage_buffer_size: 4_000_000   # Ephemeral – wiped each iteration
  strategy_buffer_size: 4_000_000    # Persistent – time-decay weighted
  time_decay_power: 1.0              # linear (t) weighting; use 2.0 for t²

# ------------------------------------------------------------------------------
# Regret Store  (memory-mapped, LZ4-compressed)
# ------------------------------------------------------------------------------
regret_store:
  base_dir: "regrets"
  n_shards: 256
  max_hot_shards: 32               # ~1.5 GB hot-tier RAM ceiling

# ------------------------------------------------------------------------------
# Parallel CFR  (multi-process workers)
# ------------------------------------------------------------------------------
parallel:
  num_workers: 4                   # Kaggle CPU cores
  max_infosets: 500_000
  use_shared_memory: true          # dict-free crc32 indexing

# ------------------------------------------------------------------------------
# Card Abstraction
# ------------------------------------------------------------------------------
abstraction:
  preflop_buckets: 8
  flop_buckets: 50
  turn_buckets: 25
  river_buckets: 12
  equity_histogram_bins: 10
  rce_opponent_samples: 500
  cache_dir: "equity_cache"

# ------------------------------------------------------------------------------
# Curriculum  (3-phase)
# ------------------------------------------------------------------------------
orchestrator:
  eval_interval: 50
  enable_hot_reload: true

  phases:
    phase_0:
      name: "Rules-Based Exploitation"
      opponents: ["calling_station", "maniac", "random", "tight_passive"]
      transition_threshold:
        min_win_rate_mbb: 50.0
        min_hands: 200_000
    phase_1:
      name: "SFT Opponent Modeling"
      opponents: ["sft_aggressive", "sft_balanced", "sft_passive"]
      transition_threshold:
        min_win_rate_mbb: 30.0
        min_hands: 500_000
        max_exploitability_pct: 1.0
    phase_2:
      name: "Co-Adaptive FSP"
      opponents: ["self_play_pool"]
      transition_threshold:
        max_exploitability_pct: 0.3

  mab:
    algorithm: "ucb"
    ucb_exploration_factor: 2.0
    pool_snapshot_interval: 50
    max_pool_size: 20

  fsp:
    snapshot_dir: "checkpoints/fsp_avg"
    max_snapshots: 100
    weighting: "linear"
    exploration_frac: 0.20
    snapshot_interval: 50

# GTO target windows for 6-Max anomaly detection
gto_matrix:
  "6":
    vpip:      [22, 28]
    pfr:       [18, 24]
    three_bet: [6,  10]
    af:        [2.5, 4.5]
    wtsd:      [24, 30]

degeneration_thresholds:
  "6":
    passivity:
      vpip_below: 18
      vpip_pfr_gap_above: 12
    maniac:
      pfr_above: 35
      three_bet_above: 20
      af_above: 8.0

# ------------------------------------------------------------------------------
# Training loop
# ------------------------------------------------------------------------------
training:
  max_iterations: 50000
  log_interval_iterations: 10
  eval_interval_iterations: 50
  save_interval_iterations: 100
  max_runtime_hours: 11.5          # Kaggle session limit (with 30-min buffer)

# ------------------------------------------------------------------------------
# Evaluation
# ------------------------------------------------------------------------------
evaluation:
  oracle_eval_interval: 500        # Run LBR oracle every N iterations
  oracle_hands: 5000
  equity_iterations: 5000
  nash_target_mbb: 100.0           # Convergence threshold

# ------------------------------------------------------------------------------
# MLOps
# ------------------------------------------------------------------------------
mlops:
  checkpoint:
    local_checkpoint_dir: "checkpoints"
    max_checkpoints_to_keep: 5
    save_interval_iterations: 100

  graceful_shutdown:
    max_runtime_hours: 11.5
    use_monotonic_clock: true
    warning_threshold_minutes: 45.0

  huggingface:
    enabled: false                 # Set true + HUGGINGFACE_TOKEN env var
    repo_id: "your-username/vr-deep-pdcfr-6max"
    sync_interval_minutes: 30
    path_in_repo: "checkpoints"

  wandb:
    enabled: false                 # Set true + WANDB_API_KEY env var
    project: "vr-deep-pdcfr-plus-6max"
    entity: ""                     # Your W&B entity / team name
    tags: ["6max", "cfr", "deep-cfr", "poker"]

# ------------------------------------------------------------------------------
# Runtime
# ------------------------------------------------------------------------------
runtime:
  device: "auto"                   # "auto" → cuda if available, else cpu
  seed: 42
  dtype: "float32"
  num_threads: 4                   # PyTorch CPU threads (non-GPU path)
