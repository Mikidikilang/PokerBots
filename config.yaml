# =============================================================================
# PokerAI-Project: Központi Hiperparaméter és Konfigurációs Fájl
# =============================================================================
# Ez a fájl a rendszer EGYETLEN IGAZSÁGFORRÁSA (Single Source of Truth) az
# összes hiperparaméter, küszöbérték, elérési út és architektúra beállítás
# számára. A DynamicConfigReloader (src/orchestrator/orchestrator.py) figyeli
# ezt a fájlt, és futásidőben, a tréning megszakítása nélkül érvényesíti
# a módosításokat (Hot-Reload).
#
# FONTOS: A Kaggle/lokális környezetek közötti eltéréseket a 'runtime'
# szekción belül kell kezelni, NEM duplikált konfigurációs fájlokkal.
# =============================================================================

# ---------------------------------------------------------------------------
# Projekt metaadatok
# ---------------------------------------------------------------------------
project:
  name: "PokerAI-NLHE"
  version: "0.1.0"
  description: "No-Limit Texas Hold'em RL AI with Auto-Adaptive Curriculum Learning"
  seed: 42                              # Globális reprodukálhatósági seed

# ---------------------------------------------------------------------------
# Futtatási környezet (Runtime)
# ---------------------------------------------------------------------------
runtime:
  platform: "kaggle"                    # Opciók: "kaggle", "local", "cloud"
  device: "auto"                        # "auto" -> CUDA ha elérhető, egyébként CPU
  num_workers: 4                        # DataLoader / Rollout worker szálak száma
  log_level: "INFO"                     # Python logging szint: DEBUG, INFO, WARNING, ERROR
  log_dir: "logs/"                      # Relatív útvonal a naplófájlokhoz

# ---------------------------------------------------------------------------
# Környezeti konfiguráció (Environment / POMDP)
# ---------------------------------------------------------------------------
environment:
  game_engine: "rlcard"                 # Játékmotor backend: "rlcard" vagy "pettingzoo"
  game_type: "no-limit-holdem"
  num_players: 6                        # Asztalméret: 2, 3, 4, 6, 8, 9
  initial_stack_bb: 200                 # Induló zsetonkészlet Big Blind egységben
  small_blind: 1                        # Kisvak mérete (abszolút chip érték)
  big_blind: 2                          # Nagyvak mérete (abszolút chip érték)

  # --- Megfigyelési Tér (Observation Space) ---
  observation_space:
    card_encoding: "multi_hot"          # 52-dimenziós bináris vektor kártyánként
    hole_cards_dim: 52                  # Saját lapok tenzor dimenziója
    community_cards_dim: 52             # Közös lapok tenzor dimenziója
    total_card_dim: 104                 # Összesített kártyatér (52 + 52)
    max_betting_rounds: 4               # Pre-flop, Flop, Turn, River
    max_actions_per_round: 18           # Maximális licitlehetőségek egy leosztásban
    betting_history_dim: [18, 9]        # [max_akciók, akció_típusok + normalizált_méretek]
    position_encoding: "one_hot"        # One-hot pozíció vektor (num_players dimenziós)
    normalization_method: "big_blind"   # Monetáris értékek normalizálása BB-hez viszonyítva
    normalization_range: [0.0, 1.0]     # Célintervallum a normalizált értékekhez

  # --- Akciótér (Action Space) ---
  action_space:
    type: "discrete"                    # Diszkretizált akciótér
    num_actions: 9                      # 9 lehetséges akció (0-8 index)
    actions:
      0: "fold"                         # Dobás
      1: "check_call"                   # Passz / Megadás
      2: "min_raise"                    # Minimum emelés
      3: "raise_0.5x_pot"              # Fél pot emelés
      4: "raise_0.75x_pot"             # 3/4 pot emelés
      5: "raise_1.0x_pot"              # Teljes pot emelés
      6: "raise_1.5x_pot"              # Másfélszeres pot (overbet)
      7: "raise_2.0x_pot"              # Kétszeres pot (deep overbet)
      8: "all_in"                       # Teljes zsetonkészlet betolása
    illegal_action_logit_mask: -1.0e+8  # LEGACY fallback; a kód torch.finfo(dtype).min-t használ (AMP-safe)

# ---------------------------------------------------------------------------
# Neurális Hálózat Architektúra (Model / Actor-Critic PPO)
# ---------------------------------------------------------------------------
model:
  architecture: "mlp_actor_critic"      # Típus: "mlp_actor_critic", "lstm_actor_critic"

  # --- Közös Beágyazó Réteg (Shared Embedding) ---
  embedding:
    card_embed_dim: 64                  # Kártyavektorok beágyazási dimenziója
    context_embed_dim: 32               # Környezeti metrikák beágyazási dimenziója
    history_embed_dim: 64               # Licittörténet beágyazási dimenziója

  # --- Actor (Policy) Hálózat ---
  actor:
    hidden_layers: [512, 256, 128]      # Rejtett rétegek neuronszámai
    activation: "relu"                  # Aktivációs függvény: "relu", "gelu", "tanh"
    dropout: 0.1                        # Dropout ráta a túlilleszkedés ellen
    output_activation: "softmax"        # Kimeneti réteg (akció valószínűségek)

  # --- Critic (Value) Hálózat ---
  critic:
    hidden_layers: [512, 256, 128]
    activation: "relu"
    dropout: 0.1
    output_dim: 1                       # Skaláris értékfüggvény kimenet

  # --- Inicializáció ---
  weight_init: "orthogonal"             # Súly inicializáció: "orthogonal", "xavier", "kaiming"
  weight_init_gain: 1.0                 # Ortogonális inicializáció nyeresége

# ---------------------------------------------------------------------------
# PPO Optimalizáció (Proximal Policy Optimization)
# ---------------------------------------------------------------------------
ppo:
  # --- Tanulási Ráta és Optimalizáló ---
  learning_rate: 3.0e-4                 # Adam optimalizáló alapértelmezett LR
  learning_rate_schedule: "linear"      # LR ütemezés: "linear", "cosine", "constant"
  lr_warmup_steps: 1000                 # Tanulási ráta bemelegítési lépések
  adam_epsilon: 1.0e-5                  # Adam numerikus stabilitási paraméter
  max_grad_norm: 0.5                    # Gradiens vágás (gradient clipping) maximális norma

  # --- PPO Specifikus Hiperparaméterek ---
  clip_epsilon: 0.2                     # PPO clipping paraméter (ε)
  clip_range_vf: 0.2                     # Value Function clip range (a Critic stabilitásához póker variancia ellen)
  entropy_coefficient: 0.01             # Entrópia reguláris együttható (c₂) - HOT-RELOADABLE
  value_loss_coefficient: 0.5           # Értékveszteség súlyozási tényező (c₁)
  gamma: 0.99                           # Diszkontálási faktor (γ)
  gae_lambda: 0.95                      # Generalized Advantage Estimation (λ)

  # --- Mintavételezés és Batch ---
  rollout_steps: 2048                   # Lépések száma egy rollout-ban (adatgyűjtés)
  num_epochs: 4                         # PPO epoch-ok száma egy batch-en belül
  batch_size: 64                        # Mini-batch méret a gradiens frissítéshez
  num_mini_batches: 4                   # Mini-batch darabszám (rollout_steps / batch_size)

  # --- Replay Buffer ---
  buffer:
    max_capacity: 1_000_000             # Maximális tapasztalatok száma a bufferben
    compression: "zstandard"            # Tömörítési algoritmus
    compression_level: 3                # Zstd kompressziós szint (1-22, optimum: 3)

# ---------------------------------------------------------------------------
# Auto-Adaptív Curriculum Orchestrator
# ---------------------------------------------------------------------------
orchestrator:
  # --- Curriculum Fázisok ---
  phases:
    # Fázis 0: Statikus botok elleni alapozás
    phase_0:
      name: "Rules-Based Exploitation"
      description: "Alapvető póker mechanikák és matematika elsajátítása statikus botok ellen"
      opponents: ["calling_station", "maniac", "random", "tight_passive"]
      transition_threshold:
        min_win_rate_mbb: 50            # Minimális nyerési ráta (mbb/hand) az átmenethez
        min_hands: 100_000              # Minimális leosztások száma a statisztikai szignifikanciához
        min_vpip_in_range: true         # VPIP a GTO célsávon belül kell legyen

    # Fázis 1: SFT ellenfelek és ellenfél-modellezés
    phase_1:
      name: "Opponent Modeling & SFT"
      description: "Finomhangolt emberi adatokon tréningelt ellenfelek elleni játék"
      opponents: ["sft_aggressive", "sft_balanced", "sft_passive", "phase_0_snapshots"]
      transition_threshold:
        min_win_rate_mbb: 30
        min_hands: 200_000
        max_exploitability_pct: 1.0     # Maximális kizsákmányolhatóság (Nash Distance %)

    # Fázis 2: Fictitious Self-Play és MAB
    phase_2:
      name: "Co-Adaptive FSP"
      description: "Multi-Armed Bandit vezérelt önjáték és Nash-konvergencia"
      opponents: ["self_play_pool", "benchmark_bots"]
      target_metrics:
        nash_distance_pct: 0.3          # Cél Nash Distance < 0.3% pot
        min_slumbot_mbb: 50             # Minimális mbb/hand a Slumbot ellen (HUNL)

  # --- Multi-Armed Bandit (MAB) konfiguráció ---
  mab:
    algorithm: "ucb"                    # MAB algoritmus: "ucb", "exp3", "thompson"
    ucb_exploration_factor: 2.0         # UCB feltárási súly (c paraméter)
    pool_snapshot_interval: 50          # Modell pillanatkép mentése minden N iteráció után
    max_pool_size: 20                   # Maximális ellenfél-pool méret

  # --- Telemetria Ablak ---
  telemetry:
    sliding_window_hands: 100_000       # Mozgóablak mérete HUD metrikák számításához
    eval_interval_iterations: 50        # Kiértékelés gyakorisága (iterációnként)
    log_interval_iterations: 10         # Naplózás gyakorisága

# ---------------------------------------------------------------------------
# GTO Mátrix: Célsávok Asztalméret Szerint
# ---------------------------------------------------------------------------
# Minden érték [min, max] tartomány formátumban. Az Orchestrator
# ezeket használja a telemetriai adatok validálásához.
# ---------------------------------------------------------------------------
gto_matrix:
  "2":    # Heads-Up (2-Max)
    vpip: [71.0, 78.0]
    pfr: [60.0, 68.0]
    three_bet: [17.5, 23.0]
    af: [2.5, 3.8]
    wtsd: [26.0, 30.0]
  "3":    # 3-Max
    vpip: [38.0, 45.0]
    pfr: [31.0, 39.0]
    three_bet: [11.5, 16.0]
    af: [2.5, 3.5]
    wtsd: [27.0, 31.0]
  "4":    # 4-Max
    vpip: [29.0, 36.0]
    pfr: [24.0, 31.0]
    three_bet: [9.0, 13.5]
    af: [2.5, 3.5]
    wtsd: [27.5, 31.5]
  "6":    # 6-Max (Pluribus benchmark)
    vpip: [21.0, 27.0]
    pfr: [17.0, 22.5]
    three_bet: [7.5, 11.5]
    af: [2.5, 3.5]
    wtsd: [28.0, 32.0]
  "8":    # 8-Max
    vpip: [15.0, 19.0]
    pfr: [12.0, 16.0]
    three_bet: [5.5, 8.5]
    af: [2.5, 3.5]
    wtsd: [28.5, 33.0]
  "9":    # 9-Max (Full Ring)
    vpip: [13.5, 17.5]
    pfr: [10.5, 14.5]
    three_bet: [4.5, 7.5]
    af: [2.5, 3.5]
    wtsd: [29.0, 33.5]

# ---------------------------------------------------------------------------
# Degenerációs Küszöbök: Patológia Detektálási Triggerek
# ---------------------------------------------------------------------------
# Ha bármely metrika átlépi ezeket az értékeket a mozgóablakos átlagban,
# az Orchestrator automatikus korrekciót indít.
# ---------------------------------------------------------------------------
degeneration_thresholds:
  "2":    # Heads-Up
    passivity:
      vpip_below: 55.0
      vpip_pfr_gap_above: 20.0
    maniac:
      pfr_above: 85.0
      three_bet_above: 30.0
      af_above: 5.0
  "3":    # 3-Max
    passivity:
      vpip_below: 28.0
      vpip_pfr_gap_above: 15.0
    maniac:
      pfr_above: 50.0
      three_bet_above: 22.0
      af_above: 4.5
  "4":    # 4-Max
    passivity:
      vpip_below: 22.0
      vpip_pfr_gap_above: 12.0
    maniac:
      pfr_above: 38.0
      three_bet_above: 18.0
      af_above: 4.5
  "6":    # 6-Max
    passivity:
      vpip_below: 16.0
      vpip_pfr_gap_above: 10.0
    maniac:
      pfr_above: 28.0
      three_bet_above: 15.0
      af_above: 4.0
  "8":    # 8-Max
    passivity:
      vpip_below: 10.0
      vpip_pfr_gap_above: 8.0
    maniac:
      pfr_above: 20.0
      three_bet_above: 11.0
      af_above: 4.0
  "9":    # 9-Max
    passivity:
      vpip_below: 10.0
      vpip_pfr_gap_above: 8.0
    maniac:
      pfr_above: 20.0
      three_bet_above: 11.0
      af_above: 4.0

# ---------------------------------------------------------------------------
# Reward Shaping: Jutalom-módosítási Paraméterek
# ---------------------------------------------------------------------------
reward_shaping:
  # All-in Spam büntető paraméterek
  bluff_penalty_lambda: 0.0             # λ_penalty: Büntető szorzó (0.0 = inaktív) - HOT-RELOADABLE
  bluff_intensity_threshold: 0.7        # Blöff intenzitási küszöb (tét/pot arány gyenge kézzel)
  # Passzivitás elleni bónusz
  preflop_aggression_bonus: 0.0         # Pozitív jutalom bónusz a pre-flop emelésekért - HOT-RELOADABLE
  # Stagnáció kezelés
  entropy_boost_factor: 2.0             # Szorzó az entrópia koefficienshez stagnáció esetén
  stagnation_window: 50                 # Iterációs ablak a stagnáció detektálásához
  stagnation_threshold: 0.001           # Minimális jutalom-változás küszöb (|Δreward|)

# ---------------------------------------------------------------------------
# MLOps Infrastruktúra (Kaggle + Hugging Face Hub)
# ---------------------------------------------------------------------------
mlops:
  # --- Hugging Face Hub ---
  hf_repo_id: "Mikidikilang/poker-ai-checkpoints"     # HF repozitórium azonosító
  hf_repo_type: "model"

  # --- Checkpoint Mentés ---
  checkpoint:
    save_interval_iterations: 100       # Modellsúlyok mentése minden N iteráció
    buffer_save_interval_iterations: 500  # Replay Buffer mentése (ritkábban, nagyobb fájlméret)
    local_checkpoint_dir: "checkpoints/"  # Lokális mentési könyvtár
    max_checkpoints_to_keep: 5          # Régi checkpointok rotálása

  # --- Aszinkron Feltöltés ---
  async_upload:
    enabled: true
    sync_interval_minutes: 15           # CommitScheduler polling intervallum
    commit_message_prefix: "auto-checkpoint"

  # --- Graceful Shutdown ---
  graceful_shutdown:
    max_runtime_hours: 11.5             # Maximális futási idő (30 perces puffer a 12 órás limithez)
    use_monotonic_clock: true           # time.monotonic() használata time.time() helyett

  # --- RNG Állapotkezelés ---
  rng_management:
    save_rng_states: true               # RNG állapotok mentése a checkpointokba
    components:                         # Mentendő RNG források
      - "python_stdlib"                 # random.getstate() / random.setstate()
      - "numpy"                         # np.random.get_state() / np.random.set_state()
      - "torch_cpu"                     # torch.get_rng_state() / torch.set_rng_state()
      - "torch_cuda"                    # torch.cuda.get_rng_state_all()
      - "dataloader"                    # Izolált torch.Generator a DataLoader-hez

# ---------------------------------------------------------------------------
# Kiértékelés és Benchmarking
# ---------------------------------------------------------------------------
evaluation:
  # --- Slumbot HUNL Benchmark (ACPC Protokoll) ---
  slumbot:
    enabled: false                      # true ha HUNL benchmarkot futtatunk
    stack_size_bb: 200                  # Uniform Stack Reset (ACPC standard)
    max_action_time_seconds: 7          # Maximális döntési idő per kéz
    min_hands: 100_000                  # Minimális minta a statisztikai szignifikanciához
    superhuman_threshold_mbb: 50        # Minimum mbb/hand a "superhuman" címkéhez

  # --- Nash Distance (Exploitability) ---
  nash_distance:
    method: "lbr"                       # Módszer: "lbr" (Local Best Response), "ismcts_br"
    target_pct: 0.3                     # Cél: Nash Distance < 0.3% pot
    eval_hands: 50_000                  # Kiértékelési minták száma

  # --- AIVAT Variancia-csökkentés ---
  aivat:
    enabled: true                       # Variancia-csökkentett értékelés engedélyezése
    baseline_type: "learned"            # "learned" vagy "uniform" baseline
